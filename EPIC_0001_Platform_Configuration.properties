# ==========================================
# BROWSER SETTINGS
# ==========================================
browser=chrome
headless=false

# Emulator Device IDs (from adb devices)
user.device.id=emulator-5554
driver.device.id=emulator-5556

# App Packages & Activities
# Verified App Details
user.app.package=com.we1.customer
user.app.activity=com.we1.customer.MainActivity

driver.app.package=com.we1.driver
driver.app.activity=com.we1.driver.MainActivity

# ==========================================
# STORE APP EMULATOR SETUP (Use This If You Want to add Store Emulator)
# ==========================================
#store.device.id=emulator-5558
#store.app.package=com.we1.store
#store.app.activity=com.we1.store.MainActivity

# Target Epic or Backlog details for automation
erp.target.type=Epic
erp.target.name=EPIC-0001

# ==========================================
# TIMEOUTS & EXECUTION SETTINGS
# ==========================================
implicit.wait=10
explicit.wait=60

filter.name=TC_RG_
excel.name=EPIC_0001_Platform_Configuration.xlsx

#Test to run for hybrid testing add sheet name from this list below to sheets.name to run that sheet:
#--------------------------------------------------------------------------------------------------------
# UserDriverWebIntialilzer,City_Area,City_Admin,Site_Setting,World_Currency,App_Version_Setting,Geo_Fencing,
# Email_Templates,Agreement_Configuration,Advertisement_Banner,Home_Page_Slider,Page_List,Panic_Call,Report_Issues,
#Add_Category,Add_Vehicle_Type,Required_Documents,Service_Settings,Super_Admin_Profile,DataCleanUpSheet

# Test Sheets to execute
sheets.name=UserDriverWebIntialilzer,City_Area,City_Admin,Site_Setting,World_Currency,App_Version_Setting,Geo_Fencing,\
  Email_Templates,Agreement_Configuration,Advertisement_Banner,Home_Page_Slider,Page_List,Panic_Call,Report_Issues,\
  Add_Category,Add_Vehicle_Type,Required_Documents,Service_Settings,Super_Admin_Profile,DataCleanUpSheet
