erp.target.name=EPIC-0006

# ==========================================
# TIMEOUTS & EXECUTION SETTINGS
# ==========================================
implicit.wait=10
explicit.wait=60

filter.name=TC_RG_
excel.name=EPIC_0006_Ride_Monitoring_Settlements.xlsx

